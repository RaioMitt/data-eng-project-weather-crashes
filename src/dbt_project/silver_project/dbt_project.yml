# Separate dbt project for the silver layer.
# Lives in its own folder so it does not touch (or depend on) the other dbt models.
name: weather_silver
version: "1.0.0"
profile: weather_dbt          # same connection as /dbt/profiles.yml

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "/tmp/weather_silver_target"
log-path: "/tmp/weather_silver_logs"
